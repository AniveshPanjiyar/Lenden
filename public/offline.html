<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Lenden Offline</title>
    <meta name="theme-color" content="#24524a" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        align-items: center;
        background:
          radial-gradient(circle at top, rgba(47, 111, 94, 0.18), transparent 42%),
          #f5f2ea;
        color: #1d2522;
        display: flex;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
        touch-action: pan-x pan-y;
      }
      main {
        width: min(420px, 100%);
        border: 1px solid rgba(49, 66, 57, 0.16);
        border-radius: 24px;
        background: rgba(255, 253, 248, 0.96);
        box-shadow: 0 24px 60px rgba(49, 66, 57, 0.16);
        padding: 28px;
        text-align: center;
      }
      img {
        width: 76px;
        height: 76px;
        border-radius: 20px;
        box-shadow: 0 14px 30px rgba(49, 66, 57, 0.18);
      }
      h1 {
        color: #24524a;
        font-size: 28px;
        margin: 0 0 12px;
      }
      p {
        color: #657166;
        font-size: 16px;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      .status {
        align-items: center;
        display: inline-flex;
        gap: 8px;
        color: #9b492f;
        font-size: 13px;
        font-weight: 800;
        margin: 18px 0 10px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .status::before {
        background: #c66a42;
        border-radius: 50%;
        content: "";
        height: 9px;
        width: 9px;
      }
      button {
        align-items: center;
        background: #2f6f5e;
        border: 0;
        border-radius: 999px;
        color: #fff;
        display: inline-flex;
        font: inherit;
        font-weight: 800;
        justify-content: center;
        min-height: 46px;
        padding: 0 22px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="Lenden logo" />
      <div class="status">Connection paused</div>
      <h1>Lenden is offline</h1>
      <p>Your saved app data remains safe. Reconnect before creating payments, approvals, or other money updates.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
